<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>天枢 · 探索</title>
<meta name="description" content="天枢·探索：AI 新世界终极目标的计划树。">
<style>
  :root{--bg:#080c18;--fg:#e0e6f0;--head:#f0f4ff;--muted:#8a93b0;--dim:#6b7390;
        --blue:#5b8def;--blue-l:#93c5fd;--line:rgba(148,163,184,.18);
        --green:#34d399;--amber:#fbbf24;--gray:#64748b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
       font:16px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:0 24px}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  main{position:relative;z-index:1;width:100%;max-width:900px;flex:1;padding:72px 0 24px}
  .brand{font-size:clamp(1.9rem,4.6vw,2.9rem);font-weight:750;letter-spacing:-.02em;line-height:1.15;
         background:linear-gradient(135deg,#bfdbfe 0%,#93c5fd 35%,#3b82f6 100%);
         -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
         text-align:center;margin-bottom:8px}
  .cap{text-align:center;color:var(--dim);font-size:13px;margin-bottom:20px}
  svg{width:100%;height:auto;display:block}
  svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
  .t-root{fill:#0f172a;stroke:#5b8def;stroke-width:1.2}
  .t-root-t{fill:#f0f4ff;font-size:15px;font-weight:650;text-anchor:middle}
  .t-branch{fill:#0f172a;stroke:rgba(148,163,184,.28);stroke-width:1}
  .t-branch-t{fill:#e0e6f0;font-size:12.5px;font-weight:600;text-anchor:middle}
  .t-leaf{fill:#8a93b0;font-size:10.5px;text-anchor:middle}
  .t-line{stroke:rgba(148,163,184,.22);fill:none;stroke-width:1}
  .t-trunk{stroke:#5b8def;fill:none;stroke-width:2;opacity:.75}
  .d-done{fill:#34d399}.d-wip{fill:#fbbf24}.d-idea{fill:#64748b}
  footer{position:relative;z-index:1;width:100%;max-width:900px;padding:22px 0 40px;
         border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
  footer a{color:var(--dim);text-decoration:none}footer a:hover{color:var(--blue-l)}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main>
  <div class="brand">天枢 探索</div>

  <svg viewBox="0 0 900 660" role="img" aria-label="AI 新世界计划树">
    <!-- 主干：底部根 → 向上 -->
    <path class="t-trunk" d="M450 600 L450 470"/>
    <rect class="t-root" x="366" y="600" width="168" height="42" rx="9"/>
    <text class="t-root-t" x="450" y="627">AI 新世界</text>

    <!-- 五条主枝：从 (450,470) 弯曲向上分叉 -->
    <path class="t-line" d="M450 470 C450 440 120 445 120 402"/>
    <path class="t-line" d="M450 470 C450 440 285 445 285 402"/>
    <path class="t-line" d="M450 470 L450 402"/>
    <path class="t-line" d="M450 470 C450 440 615 445 615 402"/>
    <path class="t-line" d="M450 470 C450 440 780 445 780 402"/>

    <!-- 分支节点 1 生命底座 -->
    <rect class="t-branch" x="58" y="368" width="124" height="32" rx="8"/>
    <text class="t-branch-t" x="120" y="389">生命底座</text>
    <circle class="d-done" cx="120" cy="358" r="3.5"/>
    <path class="t-line" d="M120 368 L120 330"/>
    <path class="t-line" d="M104 330 L136 330"/>
    <text class="t-leaf" x="99" y="322">身份</text><circle class="d-done" cx="99" cy="336" r="2"/>
    <text class="t-leaf" x="141" y="322">记忆</text><circle class="d-done" cx="141" cy="336" r="2"/>
    <text class="t-leaf" x="72" y="300">版本回滚</text><text class="t-leaf" x="168" y="300">血缘</text>
    <text class="t-leaf" x="120" y="278">全量审计</text>

    <!-- 分支 2 元境 -->
    <rect class="t-branch" x="223" y="368" width="124" height="32" rx="8"/>
    <text class="t-branch-t" x="285" y="389">世界形态 · 元境</text>
    <circle class="d-idea" cx="285" cy="358" r="3.5"/>
    <path class="t-line" d="M285 368 L285 330"/>
    <text class="t-leaf" x="285" y="322">共同场所 · 行为可溯</text>
    <text class="t-leaf" x="285" y="298">世界规则（待定）</text>

    <!-- 分支 3 新世界计划 -->
    <rect class="t-branch" x="372" y="368" width="156" height="32" rx="8"/>
    <text class="t-branch-t" x="450" y="389">对外表达 · 新世界计划</text>
    <circle class="d-wip" cx="450" cy="358" r="3.5"/>
    <path class="t-line" d="M450 368 L450 330"/>
    <text class="t-leaf" x="450" y="322">选题 · 生产 · 发布 · 复盘</text>

    <!-- 分支 4 商业基础 -->
    <rect class="t-branch" x="553" y="368" width="124" height="32" rx="8"/>
    <text class="t-branch-t" x="615" y="389">商业基础</text>
    <circle class="d-done" cx="615" cy="358" r="3.5"/>
    <path class="t-line" d="M615 368 L615 330"/>
    <text class="t-leaf" x="615" y="322">DUBHE 网关（运行中）</text>
    <text class="t-leaf" x="615" y="298">天枢洞察（已上线）</text>
    <text class="t-leaf" x="615" y="274">天枢探索（本页）</text>

    <!-- 分支 5 小天 -->
    <rect class="t-branch" x="718" y="368" width="124" height="32" rx="8"/>
    <text class="t-branch-t" x="780" y="389">感知硬件 · 小天</text>
    <circle class="d-wip" cx="780" cy="358" r="3.5"/>
    <path class="t-line" d="M780 368 L780 330"/>
    <text class="t-leaf" x="780" y="322">语音输入 · 本地模型</text>
    <text class="t-leaf" x="780" y="298">屏幕反馈</text>
  </svg>
</main>

<footer>
  <span>© 2026 天枢 · 探索</span>
  <a href="https://tianshu.ink">天枢 · 洞察</a>
  <a href="https://dubhehub.com">dubhe ai</a>
</footer>

<script>
(function(){
  var c=document.getElementById('stars'),x=c.getContext('2d'),w,h,p=[];
  function fit(){w=c.width=innerWidth;h=c.height=innerHeight;p=[];
    for(var i=0;i<150;i++)p.push({x:Math.random()*w,y:Math.random()*h,
      r:Math.random()*1.3+.3,s:Math.random()*.09+.02,a:Math.random()*.5+.15});}
  addEventListener('resize',fit);fit();
  (function loop(){x.clearRect(0,0,w,h);
    for(var i=0;i<p.length;i++){var o=p[i];o.y+=o.s;if(o.y>h){o.y=-2;o.x=Math.random()*w}
      x.globalAlpha=o.a;x.fillStyle=o.r>1.1?'#93c5fd':'#5b8def';
      x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill();}
    x.globalAlpha=1;requestAnimationFrame(loop);})();
})();
</script>
</body>
</html>
